# Builds Glimmr installers for Windows and macOS on every push, and publishes a GitHub release
# (which installed apps auto-update from) when a version tag like v1.2.0 is pushed.
#
# Optional repository secrets:
#   macOS signing + notarization: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows signing:              WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
# Without them, builds are unsigned (macOS builds are ad-hoc signed).

name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  prepare-release:
    name: Prepare release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $VERSION. Bump the version before tagging."
            exit 1
          fi
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Glimmr ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    name: Build (${{ matrix.name }})
    needs: [test, prepare-release]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
            sharp: win32 x64 arm64
          - name: macOS
            os: macos-latest
            platform: mac
            sharp: darwin arm64 x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add sharp binaries for every target architecture
        run: node scripts/add-sharp-arch.mjs ${{ matrix.sharp }}
      - run: npm run build
      - name: Package installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARGS=(--${{ matrix.platform }})
          if [ "$IS_RELEASE" = "true" ]; then ARGS+=(--publish always); else ARGS+=(--publish never); fi
          if [ "${{ matrix.platform }}" = "mac" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            else
              # No certificate: ad-hoc sign so the app runs on Apple Silicon. Updates then need a manual download on macOS.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              ARGS+=(-c.mac.identity=-)
            fi
          else
            if [ -n "$WIN_CSC_LINK" ]; then export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; fi
          fi
          npx electron-builder "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: Glimmr-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft so installed apps see the update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
