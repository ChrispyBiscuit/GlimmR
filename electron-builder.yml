appId: app.glimmr.desktop
productName: Glimmr
copyright: Copyright © 2026 Glimmr
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# No native modules need rebuilding: SQLite is built into Electron (node:sqlite); sharp and ONNX Runtime ship
# prebuilt N-API binaries.
npmRebuild: false
# sharp loads libvips binaries at runtime, so they must stay outside the asar archive.
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  # ONNX Runtime's native binding loads its shared libraries from beside it.
  - node_modules/onnxruntime-node/bin/**

win:
  icon: build/icon.png
  # ONNX Runtime (smart tags) ships binaries for every platform and architecture; keep only this build's.
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/!(${arch})/**'
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # One installer for both architectures; it installs the right one.
  artifactName: ${productName}-${version}-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Glimmr

mac:
  icon: build/icon.png
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/!(${arch})/**'
  category: public.app-category.photography
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  title: ${productName} ${version}

linux:
  icon: build/icon.png
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/!(${arch})/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_{cuda,tensorrt}.so'
  category: Graphics
  target: [AppImage]

# Auto-update: CI uploads installers and latest*.yml to a GitHub release for each version tag.
# Releases start as drafts and are published only after every platform has uploaded.
publish:
  provider: github
  owner: ChrispyBiscuit
  repo: GlimmR
  releaseType: draft
